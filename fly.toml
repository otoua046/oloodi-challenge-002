# fly.toml app configuration file generated for oloodi-challenge-002 on 2026-11-25T19:58:14Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#
# Run exactly one Machine: each Machine has its own SQLite database and live stream (fly scale count 1).

app = 'oloodi-challenge-002'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  # The Dockerfile sets HOST=0.0.0.0 and PORT=3000.
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
